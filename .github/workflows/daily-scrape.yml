name: Daily job scrape

"on":
  schedule:
    # 04:00 UTC = 09:00 Pakistan Standard Time (PKT, UTC+5)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py

      - name: Commit and push new results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/relevant_jobs_*.json output/relevant_jobs_*.csv output/run_meta_*.json
          if git diff --cached --quiet; then
            echo "No new result files to commit."
          else
            git commit -m "Daily agent run: update job results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
